name: Pet previews

permissions:
  contents: write
  deployments: write
  issues: write

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/community/star-history.svg"

concurrency:
  group: pet-previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  previews:
    outputs:
      catalog-changed: ${{ steps.commit-generated.outputs.catalog-changed }}
      generated-commit: ${{ steps.commit-generated.outputs.generated-commit }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Generate repository listings
        run: |
          npm run readmes

      - name: Validate pull request payload
        if: github.event_name == 'pull_request'
        run: |
          npm run validate:pr
          npm run lint

      - name: Find changed pets
        id: changed-pets
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA" HEAD -- 'pets/**' \
            | awk -F/ '$1 == "pets" && NF >= 3 { print $2 }' \
            | sort -u > /tmp/changed-pets.txt
          if [ -s /tmp/changed-pets.txt ]; then
            echo "has-pets=true" >> "$GITHUB_OUTPUT"
            printf 'Changed pets:\n'
            cat /tmp/changed-pets.txt
          else
            echo "has-pets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: github.event_name == 'pull_request' && steps.changed-pets.outputs.has-pets == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install preview dependencies
        if: github.event_name == 'pull_request' && steps.changed-pets.outputs.has-pets == 'true'
        run: python -m pip install -r requirements.txt

      - name: Generate pull request previews
        if: github.event_name == 'pull_request' && steps.changed-pets.outputs.has-pets == 'true'
        run: xargs python3 scripts/generate-pet-previews.py < /tmp/changed-pets.txt

      - name: Upload pull request previews
        if: github.event_name == 'pull_request' && steps.changed-pets.outputs.has-pets == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr-${{ github.event.pull_request.number }}-pet-previews
          path: assets/previews/
          if-no-files-found: error
          retention-days: 14

      - name: Validate generated listings on main
        if: github.event_name == 'push'
        run: npm run lint

      - name: Commit generated files on main
        id: commit-generated
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main moved ahead while this run was executing; skip generated commit from stale run."
            echo "catalog-changed=false" >> "$GITHUB_OUTPUT"
            echo "generated-commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            docs/zh-CN/README.md \
            docs/ko/README.md \
            docs/ja/README.md \
            docs/es/README.md \
            pets.json \
            install-manifest.json
          catalog_changed=false
          if git diff --cached --name-only | grep -Fxq pets.json; then
            catalog_changed=true
          fi
          generated_commit=false
          if ! git diff --cached --quiet; then
            git commit -m "chore: update generated previews and readmes"
            git push
            generated_commit=true
          fi
          echo "catalog-changed=$catalog_changed" >> "$GITHUB_OUTPUT"
          echo "generated-commit=$generated_commit" >> "$GITHUB_OUTPUT"

  web-quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: "https://codexpet.top"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: next-build-v1-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/app/**', 'web/components/**', 'web/lib/**', 'web/scripts/**', 'web/next.config.ts', 'web/postcss.config.mjs', 'web/tsconfig.json') }}
          restore-keys: |
            next-build-v1-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Lint web
        run: npm run lint
        working-directory: web

      - name: Build web
        run: npm run build:pr
        working-directory: web

  deploy-stats:
    if: github.event_name == 'push' && needs.previews.outputs.catalog-changed == 'true'
    needs: previews
    uses: ./.github/workflows/deploy-stats.yml
    secrets: inherit

  deploy-web:
    if: github.event_name == 'push' && needs.previews.outputs.generated-commit != 'true'
    needs: previews
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
      NEXT_PUBLIC_SITE_URL: "https://codexpet.top"

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: next-build-v1-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/app/**', 'web/components/**', 'web/lib/**', 'web/scripts/**', 'web/next.config.ts', 'web/postcss.config.mjs', 'web/tsconfig.json') }}
          restore-keys: |
            next-build-v1-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install preview dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore generated site preview cache
        uses: actions/cache@v6
        with:
          path: assets/previews
          key: site-previews-v1-${{ runner.os }}-${{ hashFiles('requirements.txt', 'scripts/generate-pet-previews.py') }}-${{ hashFiles('pets/**/pet.json', 'pets/**/spritesheet.webp') }}
          restore-keys: |
            site-previews-v1-${{ runner.os }}-${{ hashFiles('requirements.txt', 'scripts/generate-pet-previews.py') }}-

      - name: Generate changed previews for site bundle
        run: npm run previews:site

      - name: Validate repository and site previews
        run: npm run validate:site

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install stats export dependencies
        run: npm ci
        working-directory: worker

      - name: Export static stats snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:export -- --remote
        working-directory: worker

      - name: Build web
        run: npm run build
        working-directory: web

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create awesome-codex-pet \
            --production-branch=main 2>/dev/null || \
            echo "Project already exists, skipping create."

      - name: Ensure canonical www domain is attached
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node web/scripts/ensure-pages-domain.mjs www.codexpet.top

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/out --project-name=awesome-codex-pet --branch=main --commit-dirty=true

      - name: Verify AI search access
        run: node web/scripts/check-ai-search-access.mjs

      - name: Notify IndexNow
        continue-on-error: true
        run: node web/scripts/submit-indexnow.mjs web/out/sitemap.xml
