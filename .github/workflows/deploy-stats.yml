name: Deploy Stats Worker

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "pets.json"
      - "collections.json"
      - "requests.json"
      - ".github/workflows/deploy-stats.yml"
  workflow_dispatch:

concurrency:
  group: deploy-stats-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURNSTILE_API_TOKEN: ${{ secrets.TURNSTILE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      - name: Test Worker
        run: npm test
        working-directory: worker

      - name: Apply D1 migrations
        run: npm run db:migrate:remote
        working-directory: worker

      - name: Sync pet catalog
        run: npm run db:sync -- --remote
        working-directory: worker

      - name: Configure Turnstile
        run: npm run turnstile:ensure -- --remote
        working-directory: worker

      - name: Deploy Worker
        run: npm run deploy
        working-directory: worker

      - name: Sync pending manual requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run requests:sync -- --remote
        working-directory: worker
