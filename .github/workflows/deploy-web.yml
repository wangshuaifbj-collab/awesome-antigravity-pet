name: Deploy Web to Cloudflare Pages

on:
  push:
    tags:
      - "v*"
      - "web-v*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
      NEXT_PUBLIC_SITE_URL: "https://codexpet.top"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: next-build-v1-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/app/**', 'web/components/**', 'web/lib/**', 'web/scripts/**', 'web/next.config.ts', 'web/postcss.config.mjs', 'web/tsconfig.json') }}
          restore-keys: |
            next-build-v1-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install preview dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore generated site preview cache
        uses: actions/cache@v6
        with:
          path: assets/previews
          key: site-previews-v1-${{ runner.os }}-${{ hashFiles('requirements.txt', 'scripts/generate-pet-previews.py') }}-${{ hashFiles('pets/**/pet.json', 'pets/**/spritesheet.webp') }}
          restore-keys: |
            site-previews-v1-${{ runner.os }}-${{ hashFiles('requirements.txt', 'scripts/generate-pet-previews.py') }}-

      - name: Generate changed previews for site bundle
        run: npm run previews:site

      - name: Validate repository and site previews
        run: npm run validate:site

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install stats export dependencies
        run: npm ci
        working-directory: worker

      - name: Export static stats snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:export -- --remote
        working-directory: worker

      - name: Build
        run: npm run build
        working-directory: web

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create awesome-codex-pet \
            --production-branch=main 2>/dev/null || \
            echo "Project already exists, skipping create."

      - name: Ensure canonical www domain is attached
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node web/scripts/ensure-pages-domain.mjs www.codexpet.top

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/out --project-name=awesome-codex-pet --branch=main --commit-dirty=true

      - name: Verify AI search access
        run: node web/scripts/check-ai-search-access.mjs

      - name: Notify IndexNow
        continue-on-error: true
        run: node web/scripts/submit-indexnow.mjs web/out/sitemap.xml
