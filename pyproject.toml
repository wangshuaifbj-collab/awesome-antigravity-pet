[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-pet"
version = "2.0.0"
description = "Antigravity Desktop Pet Runtime - Native animated desktop companions supporting 193+ SpriteSheet characters"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Antigravity Community" }
]
dependencies = [
    "PyQt6>=6.4.0",
    "Pillow>=9.0.0",
]

[project.scripts]
antigravity-pet = "antigravity_pet.cli:main"
apet = "antigravity_pet.cli:main"
pet = "antigravity_pet.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["antigravity_pet*"]
